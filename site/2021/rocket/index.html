<!DOCTYPE html>
<!-- The 2021 React component (commit f7fbbff) as plain HTML: Rocket.scss compiled with Sass,
     and getStars() ported from JSX to a loop. The space is fixed at 640 × 320 px; in 2021 it
     filled a Bootstrap container. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CSS rocket, 2021</title>
    <link href="rocket.css" rel="stylesheet" />
    <link href="page.css" rel="stylesheet" />
  </head>
  <body>
    <div class="space">
      <div class="stars"></div>
      <div class="rocket">
        <div class="rocket__head"></div>
        <div class="rocket__body"></div>
        <div class="rocket__porthole"></div>
        <div class="rocket__flipper rocket__flipper_right"></div>
        <div class="rocket__flipper rocket__flipper_left"></div>
        <div class="rocket__flipper rocket__flipper_middle"></div>
        <div class="rocket__flame rocket__flame_1"></div>
        <div class="rocket__flame rocket__flame_2"></div>
      </div>
    </div>
    <script src="stars.js"></script>
  </body>
</html>
